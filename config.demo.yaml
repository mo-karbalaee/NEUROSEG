# Demo config — runs H1 + H2 on CPU in ~45-60 minutes.
# Use with: uv run main.py --mode train --H1 --config config.demo.yaml ...

# ── Model (small) ─────────────────────────────────────────────────────────────
dobs: 1
henc: 8
hpre: 8
dstc: 4
seg_head_hidden: 4

# ── Data ──────────────────────────────────────────────────────────────────────
seq_len: 5
img_size: 128
batch_size: 4
num_workers: 0        # avoids multiprocessing issues in demo environments
val_split: 0.2

# ── Training schedule ─────────────────────────────────────────────────────────
lr: 0.001
steps: 4              # JEPA unroll steps
seed: 42
pretrain_epochs: 20
finetune_epochs: 10

# ── H1 specific ───────────────────────────────────────────────────────────────
labeled_data_dir: data/demo

labeled_fractions: [0.1, 0.5, 0.75, 1.0]

# ── H2 specific ───────────────────────────────────────────────────────────────
# source: zebrafish (neurofinder.04.00 subset) — pretrain domain
# target: mouse visual cortex (data/demo, same as H1) — transfer domain
source_data_dir: data/demo_h2_source
target_data_dir: data/demo
finetune_budget: 10
