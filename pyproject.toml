[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroseg"
version = "0.0.1"
requires-python = ">=3.10.0"
dependencies = [
    "cellpose>=4.1.1",
    "einops>=0.8.0",
    "graphviz>=0.21",
    "ipykernel>=7.2.0",
    "langchain>=1.3.8",
    "langgraph>=1.2.4",
    "matplotlib>=3.10.9",
    "mlflow>=2.14.0",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
    "pygraphviz>=1.14",
    "pyppeteer>=0.0.25",
    "scikit-learn>=1.5.0",
    "scipy>=1.15.3",
    "tifffile>=2025.5.10",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
