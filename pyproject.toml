[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroseg"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cellpose>=4.1.1",
    "einops>=0.8.0",
    "langgraph>=1.2.4",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.15.3",
    "tifffile>=2025.5.10",
    "torch>=2.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
neuroseg = "neuroseg.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
