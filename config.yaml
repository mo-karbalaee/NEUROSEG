# neuroseg training config.
# Data paths come from the CLI (--data, --labeled-data, --output); this file
# holds only architecture and training hyperparameters, so it is not tied to
# any environment.

# ── Model ─────────────────────────────────────────────────────────────────────
dobs: 1
henc: 32
hpre: 32
dstc: 8
seg_head_hidden: 16

# ── Data ──────────────────────────────────────────────────────────────────────
img_size: 128
seq_len: 5
batch_size: 4
num_workers: 4
val_split: 0.1
test_split: 0.2

# ── Training schedule ─────────────────────────────────────────────────────────
lr: 0.001
pretrain_epochs: 20
finetune_epochs: 40
steps: 4
seed: 1
checkpoint_every: 5          # save a rolling 'latest' pretrain checkpoint every N epochs (crash recovery); 0 disables

# ── JEPA self-supervision ─────────────────────────────────────────────────────
ema_momentum: 0.996          # EMA target-encoder momentum (anti-collapse)
recon_coeff: 1.0             # weight on the pixel-reconstruction loss that shapes the encoder
pretrain_clip_stride: 10     # > seq_len: non-overlapping + frame subsample — large I/O cut per epoch

# ── H1: semi-supervised segmentation ──────────────────────────────────────────
labeled_fractions: [0.1, 0.5, 0.75, 1.0]
finetune_encoder_lr_scale: 1.0   # encoder LR during fine-tuning = lr * this (1.0 = same LR as the supervised baseline)

# ── H2: cross-species transfer ────────────────────────────────────────────────
# H2 pretrains JEPA (self-supervised) on the non-mouse SOURCE video (--source-data,
# e.g. Drosophila + zebrafish; pretrain_epochs above controls this), then linear-probes
# on the labeled mouse TARGET (--target-data): freeze the encoder, train only a head on
# probe_fraction of mouse labels, evaluate held-out mouse — pretrained vs from-scratch.
probe_fraction: 0.1              # fraction of mouse labels used to train the probe head
pretrain_max_file_gb: 5.0        # TEMP: skip source video files larger than this (excludes the 15.8 GB zebrafish ETL for a fast first run; remove to use everything)

# ── H3: temporal representation stability ─────────────────────────────────────
# H3 pools a per-neuron embedding from the (frozen) encoder over each neuron's
# footprint per frame, then compares within-neuron vs between-neuron cosine
# similarity for pretrained / supervised / random encoders. Analysis only — no training.
h3_max_clips: 40                 # clips sampled evenly across the recording (bounds runtime; null = all)
